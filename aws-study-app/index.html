<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>StudyBot AWS - Seu Assistente de Estudos</title>
    <meta name="description" content="Aplicativo inteligente de estudos sobre AWS com simulados, flashcards Anki e IA." />
    
    <!-- Configurações PWA e Temas -->
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Suporte Nativo a iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StudyBot AWS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-slate-50 dark:bg-gray-900 text-slate-800 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const hasDebugParam = new URLSearchParams(window.location.search).has('debug');
        if (isLocalhost || hasDebugParam) {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/eruda';
          script.onload = function () {
            eruda.init();
          };
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
